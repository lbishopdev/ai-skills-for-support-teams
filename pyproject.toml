[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-skills-for-support-teams"
version = "0.1.0"
description = "Demo: AI skills with hard-set scopes (least privilege, enforced in code, approval gate, audit log). Synthetic data only."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Runtime uses the standard library only.
dependencies = []

[project.optional-dependencies]
# Dev dependencies are pinned on purpose.
dev = ["pytest==9.1.1"]

[project.scripts]
scopeguard = "scopeguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
